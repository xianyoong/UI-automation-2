name: powershell_echo_loop
description: >
  Open Windows PowerShell from the Start menu, echo four fixed strings,
  validate each via UIA, save a screenshot per iteration, then close the
  window by clicking the UIA-located Close button.

inputs:
  echo_texts:
    - "delta crimson 692"
    - "velvet xenon 465"
    - "echo lunar 333"
    - "velvet river 683"

artifacts:
  screenshot_dir: "screenshots/{timestamp}"
  screenshot_name: "iter_{n}.png"
  fail_screenshot_name: "iter_{n}_FAIL.png"

timing:
  after_win_key_ms: 700
  after_search_text_ms: 1200
  after_launch_enter_ms: 2000
  after_focus_click_ms: 200
  after_type_ms: 150
  after_enter_ms: 600
  validate_poll_total_ms: 3000
  validate_poll_interval_ms: 200
  after_close_click_ms: 1000

steps:

  - id: launch_open_start
    type: key
    description: "Open Start menu via Win key."
    script: scripts/input/key.py
    args: ["win"]
    wait_after: after_win_key_ms

  - id: launch_search
    type: type_text
    description: "Type 'powershell' into the Start menu."
    script: scripts/input/type_text.py
    args: ["powershell"]
    wait_after: after_search_text_ms

  - id: launch_confirm
    type: key
    description: "Press Enter to launch the top result."
    script: scripts/input/key.py
    args: ["enter"]
    wait_after: after_launch_enter_ms

  - id: locate_window
    type: find_window
    description: "Locate the PowerShell window; stash hwnd and rect in vars."
    script: scripts/window/find_window.py
    args: ["^Windows PowerShell$"]
    capture:
      vars.hwnd: "$.cols[1]"
      vars.win_left: "$.cols[2]"
      vars.win_top: "$.cols[3]"
      vars.win_right: "$.cols[4]"
      vars.win_bottom: "$.cols[5]"

  - id: focus_window
    type: click
    description: "Click inside the PowerShell window to take focus."
    script: scripts/input/click.py
    args_expr: ["{vars.win_left + 100}", "{vars.win_top + 60}"]
    wait_after: after_focus_click_ms

  - id: echo_loop
    type: foreach
    description: "Echo, validate, screenshot — once per input text."
    items: inputs.echo_texts
    var: text
    index_var: n
    body:

      - id: type_echo_cmd
        type: type_text
        description: "Type the echo command."
        script: scripts/input/type_text.py
        args_expr: ['echo "{text}"']
        wait_after: after_type_ms

      - id: submit_cmd
        type: key
        description: "Submit the command."
        script: scripts/input/key.py
        args: ["enter"]
        wait_after: after_enter_ms

      - id: validate_console
        type: assert_console_contains
        description: "Assert the echoed text appears in the console (UIA, polled)."
        script: scripts/uia/read_console.py
        args_expr: ["{vars.hwnd}"]
        expected_contains_expr: "{text}"
        poll_total_ms: validate_poll_total_ms
        poll_interval_ms: validate_poll_interval_ms

      - id: snapshot
        type: screenshot
        description: "Save iter_{n}.png (or iter_{n}_FAIL.png on prior failure)."
        script: scripts/files/screenshot.py
        args_expr_on_pass: ["{artifacts.screenshot_dir}/iter_{n}.png"]
        args_expr_on_fail: ["{artifacts.screenshot_dir}/iter_{n}_FAIL.png"]

  - id: locate_close_button
    type: find_control
    description: "Locate the Close button inside the PowerShell window via UIA."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.hwnd}", "--name", "Close", "--control-type", "Button"]
    capture:
      vars.close_x: "$.rows[1].cols[7]"
      vars.close_y: "$.rows[1].cols[8]"

  - id: click_close
    type: click
    description: "Mouse-click the Close button center."
    script: scripts/input/click.py
    args_expr: ["{vars.close_x}", "{vars.close_y}"]
    wait_after: after_close_click_ms

  - id: assert_window_closed
    type: find_window
    description: "Re-search for the PowerShell window; must NOT be found."
    script: scripts/window/find_window.py
    args: ["^Windows PowerShell$"]
    expect_exit: 1

expected_results:
  - "PowerShell window opened from Start menu within after_launch_enter_ms."
  - "All 4 echo_texts validated via UIA console read."
  - "4 screenshots saved as screenshots/{timestamp}/iter_1..4.png."
  - "Close button located via UIA (Name=Close, ControlType=Button)."
  - "find_window after click returns exit code 1 (window gone)."
